name: TV Vega

on:
  push:
    branches: [feature/tv-platforms]
    paths:
      - 'tv-app/**'
      - 'tv-vega/**'
      - 'components/**'
      - 'data/**'
      - 'utils/**'
      - '.github/workflows/tv-vega.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VEGA_SDK_VERSION: 0.24.12112
  APP_ID: com.bayaan.tvsmoke.main

jobs:
  vega:
    name: Vega Virtual Device (${{ matrix.display }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # headless: --no-gui --no-gl-accel. xvfb: GUI and GL on a virtual X
        # display, in case the headless device has no usable display.
        display: [headless, xvfb]
    defaults:
      run:
        working-directory: tv-vega
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tv-vega/package-lock.json

      - name: Cache Vega SDK
        id: vega-cache
        uses: actions/cache@v4
        with:
          path: ~/vega
          key: vega-sdk-${{ env.VEGA_SDK_VERSION }}-linux-x86_64

      - name: Install Vega SDK
        if: steps.vega-cache.outputs.cache-hit != 'true'
        working-directory: .
        env:
          NONINTERACTIVE: 'true'
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o "$RUNNER_TEMP/get_vvm.sh"
          bash "$RUNNER_TEMP/get_vvm.sh"

      - name: Add Vega CLI to PATH
        working-directory: .
        run: |
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"
          "$HOME/vega/bin/vega" sdk list-installed

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck (shared app against Vega types)
        run: npm run typecheck

      - name: Build release vpkg
        run: npm run build:release

      - name: Build Hello World control app
        working-directory: .
        run: |
          vega project generate -t helloWorld -n cicontrol --packageId com.bayaan.cicontrol -o "$RUNNER_TEMP/cicontrol"
          cd "$RUNNER_TEMP/cicontrol"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build:release

      - name: Start virtual X display
        if: matrix.display == 'xvfb'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libgles2 mesa-utils > /dev/null
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start Vega Virtual Device
        run: |
          if [ "${{ matrix.display }}" = xvfb ]; then
            vega virtual-device start --gui -t 600
          else
            vega virtual-device start --no-gui --no-gl-accel -t 600
          fi

      - name: Install app
        run: |
          VPKG=$(find build -path '*x86_64/Release/*.vpkg' | head -1)
          VDA=$(ls ~/vega/sdk/vega-sdk/*/*/bin/tools/vda | head -1)
          # "Virtual device ready" comes seconds after launch, before the
          # system finishes booting; an install then reports OK but never
          # registers. Wait for the app list to settle, then retry the install
          # until the app shows up.
          timeout 300 "$VDA" wait-for-device
          sleep 60
          for attempt in $(seq 1 5); do
            echo "Install attempt $attempt: $VPKG"
            timeout 600 vega device install-app -p "$VPKG" || true
            timeout 300 "$VDA" wait-for-device
            for check in $(seq 1 6); do
              if vega device installed-apps | grep -q "$APP_ID"; then
                echo "$APP_ID installed"
                exit 0
              fi
              sleep 10
            done
          done
          echo "$APP_ID never appeared in installed-apps"
          vega device installed-apps || true
          exit 1

      - name: Install control app
        # Installed after Bayaan so the boot wait above covers both.
        run: |
          CONTROL_VPKG=$(find "$RUNNER_TEMP/cicontrol/build" -path '*x86_64/Release/*.vpkg' | head -1)
          timeout 600 vega device install-app -p "$CONTROL_VPKG"

      - name: Control app smoke test (Hello World)
        continue-on-error: true
        env:
          SMOKE_APP_ID: com.bayaan.cicontrol.main
          SMOKE_KEYS: '0'
        run: bash scripts/ci-smoke.sh "$RUNNER_TEMP/vega-smoke/control"

      - name: Smoke test
        run: bash scripts/ci-smoke.sh "$RUNNER_TEMP/vega-smoke/bayaan"

      - name: Collect Vega SDK logs
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/vega-smoke/sdk-logs"
          cp -r "$HOME"/vega/sdk/vega-sdk/*/*/logs/. "$RUNNER_TEMP/vega-smoke/sdk-logs/" || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vega-smoke-${{ matrix.display }}
          path: ${{ runner.temp }}/vega-smoke
          if-no-files-found: warn

      - name: Stop Vega Virtual Device
        if: always()
        run: vega virtual-device stop || true
