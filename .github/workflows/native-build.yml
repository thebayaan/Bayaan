name: Native Build (Android)

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.config.js
      - '*.config.js'
      - android/**
      - plugins/**
      - patches/**
      - .github/workflows/native-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No secrets are used. android/ is committed, so no prebuild step is needed.
    # The Sentry Expo plugin is only wired when EXPO_PUBLIC_SENTRY_DSN is set
    # (it is not here), and the debug build uses the committed debug.keystore.
    # SENTRY_DISABLE_AUTO_UPLOAD guards against any upload task if that changes.
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs patch-package (patches/) via postinstall.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Build a single ABI to keep native compile time down; this job checks
      # that the project compiles, not that every ABI links.
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
