name: Native Build (Android)

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.config.js
      - '*.config.js'
      - android/**
      - modules/**
      - plugins/**
      - patches/**
      - .github/workflows/native-build.yml
  workflow_dispatch:
    # @ai-start
    inputs:
      preview_apk:
        description: Build a standalone Android preview APK
        type: boolean
        default: false
      debug_preview:
        description: Use a faster ARM64 debug APK for emulator testing (requires Metro)
        type: boolean
        default: false
    # @ai-end

permissions:
  contents: read # @ai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.debug_preview }} # @ai
  cancel-in-progress: true

jobs:
  android:
    name: ${{ inputs.preview_apk && (inputs.debug_preview && 'Debug preview APK' || 'Standalone preview APK') || 'Gradle assembleDebug' }} # @ai
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No secrets are used. android/ is committed, so no prebuild step is needed.
    # The Sentry Expo plugin is only wired when EXPO_PUBLIC_SENTRY_DSN is set
    # (it is not here), and the debug build uses the committed debug.keystore.
    # SENTRY_DISABLE_AUTO_UPLOAD guards against any upload task if that changes.
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # @ai
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs patch-package (patches/) via postinstall.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # @ai-start
      - name: Copy bundled widget fonts
        run: npm run sync:widget-fonts
      # @ai-end

      # Build a single ABI to keep native compile time down; this job checks
      # that the project compiles, not that every ABI links. On Expo SDK 58 the
      # hosted runner shut down mid-build with unbounded workers (most likely
      # out of memory), so cap them like the preview builds below; df/free
      # are logged to diagnose a repeat.
      - name: Assemble debug APK
        if: ${{ !inputs.preview_apk }} # @ai
        working-directory: android
        run: |
          df -h / && free -h
          ./gradlew assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64

      # @ai-start
      # plugins/withOkHttpFloor.js raises OkHttp to 4.12.1, which refuses the
      # compromised eMudhra CAs. Fail if any module drags the release app
      # below it.
      - name: Check OkHttp is 4.12.1 or newer
        if: ${{ !inputs.preview_apk }}
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q > okhttp-deps.txt
          versions=$(grep -oE 'com\.squareup\.okhttp3:okhttp:[^ ]+( -> [^ ]+)?' okhttp-deps.txt | sed -E 's/.* -> //; s/.*://' | sort -uV)
          echo "OkHttp resolves to: $versions"
          [ -n "$versions" ] || { echo "OkHttp not found in releaseRuntimeClasspath"; exit 1; }
          lowest=$(printf '%s\n' $versions 4.12.1 | sort -V | head -1)
          [ "$lowest" = "4.12.1" ] || { echo "OkHttp $lowest is below 4.12.1"; exit 1; }
      # @ai-end

      # @ai-start
      # Release bundles JavaScript and uses the committed debug key when no
      # release credentials are configured. This is an installable test build.
      - name: Assemble standalone preview APK
        if: ${{ inputs.preview_apk && !inputs.debug_preview }}
        working-directory: android
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Assemble debug preview APK
        if: ${{ inputs.preview_apk && inputs.debug_preview }}
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Upload preview APK
        if: ${{ inputs.preview_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bayaan-android-preview
          path: android/app/build/outputs/apk/${{ inputs.debug_preview && 'debug' || 'release' }}/*.apk
          if-no-files-found: error
          retention-days: 14
      # @ai-end
