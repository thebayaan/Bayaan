# @ai-generated
name: i18n

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # @ai-start — keep the local Amharic resource/font gates reproducible in CI.
  amharic:
    name: Amharic inventory and UI fonts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned font verification dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/rewayah/requirements-ci.txt

      - name: Verification tooling regressions
        run: python -B -m unittest discover -s scripts/__tests__ -p 'test_i18n_*.py'

      - name: Amharic source-value policy and fallback inventory
        run: python -B scripts/report-amharic-coverage.py --check

      - name: UI font hashes, Latin preservation and Ethiopic coverage
        run: python -B scripts/verify-ethiopic-ui-fonts.py
  # @ai-end

  check:
    name: Locale keys and hardcoded strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # i18next-cli needs Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Blocking: every key used in code exists in the English files and in
      # every shipped language.
      - name: Keys in sync with code
        run: npx i18next-cli extract --ci --dry-run

      # Blocking: no hardcoded text in <Text>, <TextInput>, <Button> or the
      # text props listed in i18next.config.ts.
      - name: Hardcoded strings and placeholders
        if: success() || failure()
        run: npx i18next-cli lint

      # Advisory: translation progress for shipped languages. In-progress
      # languages are left out of i18next.config.ts on purpose.
      - name: Translation status
        if: success() || failure()
        continue-on-error: true
        run: npx i18next-cli status

      # Advisory: keys no code references. Keys built at runtime show up here
      # too, so check before deleting anything.
      - name: Unused keys
        if: success() || failure()
        continue-on-error: true
        run: npx i18next-cli status --unused
