# Opens the mushaf on ${PAGE}. A deep link doesn't navigate while the mushaf
# is already open, so leave it first. Timeouts are long because CI simulators
# are slow.
appId: com.bayaan.app
---
- runFlow:
    when:
      visible:
        id: 'BackButton'
    commands:
      - tapOn:
          id: 'BackButton'
      - waitForAnimationToEnd:
          timeout: 10000
- openLink: 'bayaan://mushaf?page=${PAGE}'
- runFlow: accept-link.yaml
- extendedWaitUntil:
    visible: 'Options'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 15000
