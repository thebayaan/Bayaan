# iOS asks "Open in \"Bayaan\"?" before handing a deep link to the app. On
# slow CI simulators the prompt can show late, or again after the app has
# already opened the link, and it hides the app from the accessibility tree
# while it is up. So keep accepting it until ${EXPECT} is on screen.
appId: com.bayaan.app
---
- repeat:
    while:
      notVisible: ${EXPECT}
    times: 8
    commands:
      - tapOn:
          text: 'Open'
          optional: true
      - extendedWaitUntil:
          visible: ${EXPECT}
          timeout: 15000
          optional: true
- extendedWaitUntil:
    visible: ${EXPECT}
    timeout: 30000
