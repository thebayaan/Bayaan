# New build over the old data. Since PR #329 a legacy Warsh row on Hafs "1:7"
# covers every Warsh verse holding words of Hafs 1:7, i.e. Warsh 1:6 and 1:7:
# both should be tinted on page 1, and the list labels the bookmark "1:6-7".
appId: com.bayaan.app
---
- runFlow: ../../common/launch.yaml
- runFlow:
    file: ../../common/open-page.yaml
    env:
      PAGE: 1
- takeScreenshot: page1-after-upgrade
- runFlow: ../../common/bookmarks-list.yaml
- takeScreenshot: bookmarks-list-after-upgrade
- assertVisible: '1:6-7, Warsh.*'
