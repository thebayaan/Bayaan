<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>RFC-029: the ayah side panel beside the Mushaf page, and as a card in a narrower window</title>
  <rect x="0" y="0" width="880" height="490" fill="#ffffff"/>

  <!-- Frame A: window of 900 pt or more -->
  <text x="20" y="26" font-size="14" font-weight="600" fill="#1f2328">A. Tablet window of 900 pt or more: the panel beside the page</text>
  <rect x="20" y="40" width="520" height="360" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <!-- reader pane -->
  <rect x="20" y="40" width="370" height="360" rx="10" fill="#f6f8fa"/>
  <!-- header -->
  <circle cx="44" cy="64" r="12" fill="#ffffff" stroke="#8c959f"/>
  <text x="44" y="68" text-anchor="middle" fill="#1f2328">‹</text>
  <rect x="140" y="50" width="110" height="30" rx="8" fill="#eaeef2"/>
  <text x="195" y="63" text-anchor="middle" fill="#1f2328" font-weight="600">Surah ⌄</text>
  <text x="195" y="75" text-anchor="middle" fill="#57606a" font-size="9">Page · Juz · Rewayah</text>
  <circle cx="300" cy="64" r="12" fill="#ffffff" stroke="#8c959f"/>
  <text x="300" y="68" text-anchor="middle" fill="#1f2328" font-size="10">⇪</text>
  <circle cx="332" cy="64" r="12" fill="#ffffff" stroke="#8c959f"/>
  <text x="332" y="68" text-anchor="middle" fill="#1f2328" font-size="10">Aa</text>
  <!-- panel button, filled while open -->
  <circle cx="364" cy="64" r="12" fill="#1f2328"/>
  <rect x="357" y="58" width="14" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="365" y1="58" x2="365" y2="70" stroke="#ffffff" stroke-width="1.5"/>
  <text x="384" y="96" text-anchor="end" fill="#0969da" font-size="10">panel button (filled while open)</text>
  <!-- page -->
  <rect x="120" y="106" width="150" height="250" rx="2" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="130" y="118" width="130" height="16" rx="2" fill="#eaeef2"/>
  <rect x="134" y="146" width="122" height="10" rx="2" fill="#d0d7de"/>
  <rect x="134" y="166" width="122" height="10" rx="2" fill="#b6d4fe"/>
  <rect x="134" y="186" width="122" height="10" rx="2" fill="#d0d7de"/>
  <rect x="134" y="206" width="122" height="10" rx="2" fill="#d0d7de"/>
  <rect x="134" y="226" width="122" height="10" rx="2" fill="#d0d7de"/>
  <rect x="134" y="246" width="122" height="10" rx="2" fill="#d0d7de"/>
  <text x="195" y="374" text-anchor="middle" fill="#57606a" font-size="10">The page re-fits into the rest of the window.</text>
  <text x="195" y="388" text-anchor="middle" fill="#57606a" font-size="10">The selected ayah stays highlighted.</text>
  <!-- side panel -->
  <rect x="390" y="40" width="150" height="360" fill="#ffffff" stroke="#8c959f"/>
  <text x="400" y="62" fill="#1f2328" font-weight="600">Ayah 2:2</text>
  <text x="400" y="76" fill="#57606a" font-size="10">Surah name</text>
  <text x="528" y="66" text-anchor="end" fill="#1f2328" font-size="14">×</text>
  <rect x="398" y="86" width="134" height="22" rx="6" fill="#eaeef2"/>
  <rect x="400" y="88" width="44" height="18" rx="5" fill="#ffffff"/>
  <text x="422" y="101" text-anchor="middle" fill="#1f2328" font-size="9">Tafsir</text>
  <text x="466" y="101" text-anchor="middle" fill="#57606a" font-size="9">Reflections</text>
  <text x="511" y="101" text-anchor="middle" fill="#57606a" font-size="9">Notes</text>
  <rect x="400" y="122" width="80" height="7" rx="2" fill="#d0d7de"/>
  <rect x="400" y="138" width="130" height="7" rx="2" fill="#d0d7de"/>
  <rect x="400" y="152" width="130" height="7" rx="2" fill="#d0d7de"/>
  <rect x="400" y="166" width="110" height="7" rx="2" fill="#d0d7de"/>
  <text x="465" y="420" text-anchor="middle" fill="#57606a" font-size="10">360 pt, trailing edge</text>
  <text x="465" y="434" text-anchor="middle" fill="#57606a" font-size="10">(the left edge in an RTL UI)</text>

  <!-- Frame B: narrower tablet window -->
  <text x="580" y="26" font-size="14" font-weight="600" fill="#1f2328">B. Tablet window under 900 pt: a card</text>
  <rect x="580" y="40" width="280" height="360" rx="10" fill="#8c959f" stroke="#8c959f"/>
  <rect x="660" y="90" width="120" height="250" rx="2" fill="#afb8c1"/>
  <rect x="600" y="110" width="240" height="210" rx="12" fill="#ffffff" stroke="#57606a"/>
  <text x="614" y="134" fill="#1f2328" font-weight="600">Ayah 2:2</text>
  <text x="826" y="136" text-anchor="end" fill="#1f2328" font-size="14">×</text>
  <rect x="612" y="146" width="216" height="22" rx="6" fill="#eaeef2"/>
  <rect x="614" y="148" width="70" height="18" rx="5" fill="#ffffff"/>
  <text x="649" y="161" text-anchor="middle" fill="#1f2328" font-size="9">Tafsir</text>
  <text x="720" y="161" text-anchor="middle" fill="#57606a" font-size="9">Reflections</text>
  <text x="792" y="161" text-anchor="middle" fill="#57606a" font-size="9">Notes</text>
  <rect x="614" y="182" width="100" height="7" rx="2" fill="#d0d7de"/>
  <rect x="614" y="198" width="212" height="7" rx="2" fill="#d0d7de"/>
  <rect x="614" y="212" width="212" height="7" rx="2" fill="#d0d7de"/>
  <text x="720" y="420" text-anchor="middle" fill="#57606a" font-size="10">Centred, at most 560 pt wide, modal.</text>
  <text x="720" y="434" text-anchor="middle" fill="#57606a" font-size="10">A tap outside closes it.</text>

  <text x="20" y="458" fill="#0969da" font-size="11">Panel button with no ayah selected: the panel opens on the first ayah of the page on screen. A second tap closes it.</text>
  <text x="20" y="478" fill="#57606a" font-size="11">Phones: no change (the verse card). The Reflections tab shows only with a reflections provider (RFC-018); Notes only with the verseNotes flag.</text>
</svg>
