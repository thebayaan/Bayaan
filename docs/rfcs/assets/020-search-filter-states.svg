<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="470" rx="10" fill="#f7f6f2"/>

  <!-- ============ Panel A — Resting (Browse chips + curated Collections) ============ -->
  <rect x="40" y="28" width="300" height="382" rx="26" fill="#ffffff" stroke="#d8d6cf" stroke-width="2"/>
  <text x="62" y="66" font-size="17" font-weight="700" fill="#2a2a2a">Search</text>

  <!-- search bar (placeholder) -->
  <rect x="62" y="80" width="256" height="34" rx="10" fill="#f0efe9" stroke="#e4e2da"/>
  <circle cx="80" cy="97" r="5" fill="none" stroke="#a8a69c" stroke-width="1.5"/>
  <line x1="84" y1="101" x2="88" y2="105" stroke="#a8a69c" stroke-width="1.5"/>
  <text x="96" y="101" font-size="12" fill="#9a988f">Search reciters &amp; surahs</text>

  <!-- BROWSE — filter dimensions as horizontally-scrollable chips -->
  <text x="62" y="144" font-size="11" font-weight="700" fill="#8a887f" letter-spacing="1">BROWSE</text>
  <text x="318" y="144" font-size="10" fill="#a8a69c" text-anchor="end">filters · scroll ›</text>
  <g>
    <rect x="62" y="154" width="86" height="30" rx="15" fill="#f0efe9" stroke="#e4e2da"/>
    <text x="75" y="173" font-size="11.5"><tspan fill="#3a3a3a" font-weight="600">Country</tspan> <tspan fill="#9a988f" font-weight="700">27</tspan></text>

    <rect x="156" y="154" width="80" height="30" rx="15" fill="#f0efe9" stroke="#e4e2da"/>
    <text x="169" y="173" font-size="11.5"><tspan fill="#3a3a3a" font-weight="600">Rewaya</tspan> <tspan fill="#9a988f" font-weight="700">13</tspan></text>

    <rect x="244" y="154" width="88" height="30" rx="15" fill="#f0efe9" stroke="#e4e2da"/>
    <text x="257" y="173" font-size="11.5"><tspan fill="#3a3a3a" font-weight="600">Paradise</tspan> <tspan fill="#9a988f" font-weight="700">8</tspan></text>
  </g>

  <!-- COLLECTIONS — curated, manual, static cards -->
  <text x="62" y="222" font-size="11" font-weight="700" fill="#8a887f" letter-spacing="1">COLLECTIONS</text>
  <text x="318" y="222" font-size="10" fill="#a8a69c" text-anchor="end">curated · manual</text>
  <rect x="62" y="232" width="122" height="62" rx="12" fill="#f4f3ee" stroke="#e6e4dc"/>
  <text x="74" y="258" font-size="11.5" font-weight="700" fill="#3a3a3a">Morning</text>
  <text x="74" y="273" font-size="11.5" font-weight="700" fill="#3a3a3a">reflections</text>
  <text x="74" y="288" font-size="10" fill="#9a988f">6 surahs</text>

  <rect x="196" y="232" width="122" height="62" rx="12" fill="#f4f3ee" stroke="#e6e4dc"/>
  <text x="208" y="258" font-size="11.5" font-weight="700" fill="#3a3a3a">Quick listen</text>
  <text x="208" y="288" font-size="10" fill="#9a988f">6 surahs</text>

  <text x="62" y="326" font-size="10.5" fill="#9a988f">Hand-picked &amp; static — not part</text>
  <text x="62" y="341" font-size="10.5" fill="#9a988f">of the composable filters.</text>

  <text x="190" y="436" font-size="11.5" fill="#6a6862" text-anchor="middle">Browse = filter chips · Collections = static</text>

  <!-- ============ Panel B — Composing (editable chips) ============ -->
  <rect x="400" y="28" width="300" height="382" rx="26" fill="#ffffff" stroke="#d8d6cf" stroke-width="2"/>
  <text x="422" y="66" font-size="17" font-weight="700" fill="#2a2a2a">Search</text>

  <!-- search bar (active) -->
  <rect x="422" y="80" width="256" height="34" rx="10" fill="#ffffff" stroke="#b9b6ac" stroke-width="1.5"/>
  <circle cx="440" cy="97" r="5" fill="none" stroke="#8a887f" stroke-width="1.5"/>
  <line x1="444" y1="101" x2="448" y2="105" stroke="#8a887f" stroke-width="1.5"/>
  <line x1="458" y1="89" x2="458" y2="105" stroke="#57554e" stroke-width="1.5"/>

  <!-- chip row 1 -->
  <rect x="422" y="128" width="134" height="26" rx="13" fill="#eae6dd" stroke="#d8d2c4"/>
  <text x="433" y="145" font-size="11" font-weight="500" fill="#4a463d">Country: Algeria</text>
  <text x="541" y="146" font-size="11" fill="#8a887f">✕</text>

  <rect x="564" y="128" width="112" height="26" rx="13" fill="#eae6dd" stroke="#d8d2c4"/>
  <text x="575" y="145" font-size="11" font-weight="500" fill="#4a463d">Rewaya: Hafs</text>
  <text x="660" y="146" font-size="11" fill="#8a887f">✕</text>

  <!-- chip row 2: add -->
  <rect x="422" y="162" width="96" height="26" rx="13" fill="none" stroke="#c7c3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="433" y="179" font-size="11" fill="#8a887f">+ Add filter</text>

  <text x="422" y="212" font-size="12" font-weight="700" fill="#57554e">8 reciters</text>

  <!-- result rows -->
  <g>
    <circle cx="438" cy="240" r="15" fill="#e2dfd6" stroke="#d3cfc4"/>
    <text x="462" y="237" font-size="12.5" font-weight="600" fill="#3a3a3a">Hajar Boussaq</text>
    <text x="462" y="252" font-size="11" fill="#9a988f">Algeria</text>
    <rect x="612" y="229" width="64" height="22" rx="11" fill="#f0efe9" stroke="#e4e2da"/>
    <text x="644" y="244" font-size="11" fill="#6a6862" text-anchor="middle">Hafs</text>

    <circle cx="438" cy="286" r="15" fill="#e2dfd6" stroke="#d3cfc4"/>
    <text x="462" y="283" font-size="12.5" font-weight="600" fill="#3a3a3a">Asma Filali</text>
    <text x="462" y="298" font-size="11" fill="#9a988f">Algeria</text>
    <rect x="612" y="275" width="64" height="22" rx="11" fill="#f0efe9" stroke="#e4e2da"/>
    <text x="644" y="290" font-size="11" fill="#6a6862" text-anchor="middle">Hafs</text>

    <circle cx="438" cy="332" r="15" fill="#e2dfd6" stroke="#d3cfc4"/>
    <text x="462" y="329" font-size="12.5" font-weight="600" fill="#3a3a3a">Nour El Houda</text>
    <text x="462" y="344" font-size="11" fill="#9a988f">Algeria</text>
    <rect x="612" y="321" width="64" height="22" rx="11" fill="#f0efe9" stroke="#e4e2da"/>
    <text x="644" y="336" font-size="11" fill="#6a6862" text-anchor="middle">Hafs</text>
  </g>

  <text x="550" y="436" font-size="11.5" fill="#6a6862" text-anchor="middle">Reveals editable chips on search / Browse-chip tap</text>
</svg>
