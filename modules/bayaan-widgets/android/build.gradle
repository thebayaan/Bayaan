buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.bayaanwidgets'
version = '0.1.0'

android {
  namespace "expo.modules.bayaanwidgets"
  defaultConfig { versionCode 1; versionName "0.1.0" }
  buildFeatures { compose true }
  testOptions { unitTests { includeAndroidResources = true; returnDefaultValues = true } }
}

dependencies {
  // ReactHost for the headless widget root (version pinned by the RN Gradle plugin). // @ai
  implementation "com.facebook.react:react-android" // @ai
  implementation 'androidx.glance:glance-appwidget:1.1.1'
  implementation 'androidx.glance:glance-material3:1.1.1'
  implementation 'androidx.media3:media3-session:1.9.0'
  // Already pulled in at runtime by Glance; declared to schedule the override expiry.
  implementation 'androidx.work:work-runtime-ktx:2.7.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
